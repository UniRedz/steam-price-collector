name: collect

on:
  schedule:
    - cron: "17 3 * * *"   # ogni giorno 03:17 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "Job da eseguire"
        type: choice
        options: [collect, itad, both]
        default: collect

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prezzi Steam (tutte le regioni)
        if: github.event_name == 'schedule' || inputs.job == 'collect' || inputs.job == 'both'
        run: node src/collect.mjs
      - name: ITAD (il lunedi, o manuale)
        if: github.event_name == 'schedule' || inputs.job == 'itad' || inputs.job == 'both'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Non e' lunedi, salto ITAD"; exit 0
          fi
          node src/itad.mjs
